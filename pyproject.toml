[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "acsfgp"
version = "0.1.0"
description = "ACSF descriptors + Gaussian process surrogates for MD trajectories"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["molecular-dynamics", "machine-learning", "interatomic-potential",
            "ACSF", "gaussian-process", "surrogate-model"]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.1",
    "ase>=3.22",
    "joblib>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
acsfgp = "acsfgp.cli:main"

[tool.setuptools.packages.find]
include = ["acsfgp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
